# C compilers for the `m6809` environment (compiler-explorer --env m6809).
# @toolchain@, @m6809sim@, @m6800sim@ and @objdump@ are replaced with store
# paths by flake.nix.
compilers=&m6809:&m6800
defaultCompiler=m6809-clang
objdumper=@objdump@
objdumperType=llvm
demangler=
supportsBinary=true
supportsBinaryObject=true
binaryHideFuncRe=^(__.*|_start)$
stubRe=\bmain\b
stubText=int main(void){return 0;/*stub provided by Compiler Explorer*/}

# Binaries link for the simulator board through the <cpu>-sim.cfg clang
# config, and the simulator runs them for the execution pane. -stats adds
# instruction and cycle counts. emulated tells CE not to require a host-CPU
# binary before running it.
group.m6809.compilers=m6809-clang
group.m6809.groupName=M6809
group.m6809.compilerType=clang
group.m6809.isSemVer=false
group.m6809.options=--target=m6809 --config=m6809-sim.cfg
group.m6809.supportsExecute=true
group.m6809.emulated=true
group.m6809.executionWrapper=@m6809sim@/bin/m6809-sim
group.m6809.executionWrapperArgs=-stats
compiler.m6809-clang.exe=@toolchain@/bin/clang
compiler.m6809-clang.name=clang (6809)

group.m6800.compilers=m6800-clang
group.m6800.groupName=M6800
group.m6800.compilerType=clang
group.m6800.isSemVer=false
group.m6800.options=--target=m6800 --config=m6800-sim.cfg
# The M6800 backend has no disassembler yet, so no binary views.
group.m6800.supportsBinary=false
group.m6800.supportsBinaryObject=false
group.m6800.supportsExecute=true
group.m6800.emulated=true
group.m6800.executionWrapper=@m6800sim@/bin/m6800-sim
group.m6800.executionWrapperArgs=-stats
compiler.m6800-clang.exe=@toolchain@/bin/clang
compiler.m6800-clang.name=clang (HD6301)

# Only the tools that make sense for these targets, using the LLVM versions.
tools=readelf:nm
tools.readelf.name=llvm-readelf
tools.readelf.exe=@toolchain@/bin/llvm-readelf
tools.nm.name=llvm-nm
tools.nm.exe=@toolchain@/bin/llvm-nm
