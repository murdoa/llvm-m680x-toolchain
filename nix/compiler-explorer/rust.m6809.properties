# Rust compilers for the `m6809` environment.
#
# TODO: build rustc in nix. For now @rustc@ is a script that runs the rustc
# named by $M6809_RUSTC, which the launcher sets to the stage 1 build in
# third_party/rust when it finds one (see rust/README.md). Without it these
# compilers fail their version check and CE leaves them out.
compilers=&m6809:&m6800
defaultCompiler=m6809-rustc
compilerType=rust
objdumper=@objdump@
objdumperType=llvm
llvmObjdumper=@objdump@
demangler=@toolchain@/bin/llvm-cxxfilt
demanglerArgs=
supportsBinary=true
supportsBinaryObject=true
binaryHideFuncRe=^(__.*|_start)$
tools=

# The options make the crate no_std and no_main, so plain functions compile
# and a linked program supplies
#     #[unsafe(no_mangle)] extern "C" fn main() -> i16
# and a #[panic_handler]. -Zcross-crate-inline-threshold=never keeps rustc
# from skipping small pub fns that nothing in the crate calls. Binaries
# link with clang against the C runtime and the simulator board.
stubRe=\bmain\b
stubText=#[panic_handler] fn panic(_: &core::panic::PanicInfo) -> ! { loop {} } #[unsafe(no_mangle)] extern "C" fn main() -> i16 { 0 }

group.m6809.compilers=m6809-rustc
group.m6809.groupName=M6809
group.m6809.isSemVer=false
group.m6809.options=--target m6809-none-elf -Zcrate-attr=no_std -Zcrate-attr=no_main -Zcross-crate-inline-threshold=never -Alinker_messages -Clinker=@toolchain@/bin/clang -Clink-arg=--config=m6809-sim.cfg -Clink-arg=-lc
group.m6809.supportsExecute=true
group.m6809.emulated=true
group.m6809.executionWrapper=@m6809sim@/bin/m6809-sim
group.m6809.executionWrapperArgs=-stats
compiler.m6809-rustc.exe=@rustc@
compiler.m6809-rustc.name=rustc (6809)

group.m6800.compilers=m6800-rustc
group.m6800.groupName=M6800
group.m6800.isSemVer=false
group.m6800.options=--target m6800-none-elf -Zcrate-attr=no_std -Zcrate-attr=no_main -Zcross-crate-inline-threshold=never -Alinker_messages -Clinker=@toolchain@/bin/clang -Clink-arg=--config=m6800-sim.cfg -Clink-arg=-lc
group.m6800.supportsExecute=true
group.m6800.emulated=true
group.m6800.executionWrapper=@m6800sim@/bin/m6800-sim
group.m6800.executionWrapperArgs=-stats
compiler.m6800-rustc.exe=@rustc@
compiler.m6800-rustc.name=rustc (HD6301)
