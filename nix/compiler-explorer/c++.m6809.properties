# C++ compilers for the `m6809` environment (compiler-explorer --env m6809).
# @toolchain@, @sim@ and @objdump@ are replaced with store paths by flake.nix.
compilers=&m6809
defaultCompiler=m6809-clangxx
objdumper=@objdump@
objdumperType=llvm
demangler=@toolchain@/bin/llvm-cxxfilt
supportsBinary=true
supportsBinaryObject=true
binaryHideFuncRe=^(__.*|_start)$
stubRe=\bmain\b
stubText=int main(void){return 0;/*stub provided by Compiler Explorer*/}

group.m6809.compilers=m6809-clangxx
group.m6809.groupName=M6809
group.m6809.compilerType=clang
group.m6809.isSemVer=false
# There is no libc++ for m6809 yet.
group.m6809.options=--target=m6809 --config=m6809-sim.cfg -fno-exceptions -fno-rtti -nostdlib++
# m6809-sim.cfg links binaries for the simulator board, which then runs
# them for the execution pane. -stats adds instruction and cycle counts.
group.m6809.supportsExecute=true
# Tells CE not to require a host-CPU binary before running it.
group.m6809.emulated=true
group.m6809.executionWrapper=@sim@/bin/m6809-sim
group.m6809.executionWrapperArgs=-stats

compiler.m6809-clangxx.exe=@toolchain@/bin/clang++
compiler.m6809-clangxx.name=clang++ (m6809)

# Only the tools that make sense for this target, using the LLVM versions.
tools=readelf:nm
tools.readelf.name=llvm-readelf
tools.readelf.exe=@toolchain@/bin/llvm-readelf
tools.nm.name=llvm-nm
tools.nm.exe=@toolchain@/bin/llvm-nm
